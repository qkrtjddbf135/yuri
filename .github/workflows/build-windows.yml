name: Build SURVIVOR Windows Game

on:
  workflow_dispatch:
  push:
    paths:
      - 'survivor_theme_boss_music_graphics.py'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download game source
        uses: actions/checkout@v7

      - name: Install Python in the cloud
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Build the game
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SURVIVOR --collect-all pygame survivor_theme_boss_music_graphics.py

      - name: Upload the game
        uses: actions/upload-artifact@v7
        with:
          name: SURVIVOR-Windows
          path: dist/SURVIVOR/
          if-no-files-found: error
          retention-days: 7
